name: List Gemini models (diagnostikk)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - env: { K: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          curl -s -H "x-goog-api-key: $K" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(m['name'], m.get('supportedGenerationMethods')) for m in d.get('models',[]) if 'flash' in m['name'] or 'pro' in m['name']];print(d.get('error'))"
          curl -s -H "x-goog-api-key: $K" -H "Content-Type: application/json" "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent" -d '{"contents":[{"parts":[{"text":"Svar med JSON {\"ok\":true}"}]}],"generationConfig":{"responseMimeType":"application/json","thinkingConfig":{"thinkingBudget":0}}}' | head -c 600
