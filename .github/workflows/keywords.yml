name: Keyword research (Google autocomplete)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  kw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/keywords.py
      - run: |
          git config user.name "skadedyrguiden-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/keywords.json && git commit -m "Update keyword research [skip ci]" && git pull --rebase -q && git push || true
