name: Deploy AI worker (Cloudflare)

# Publiserer worker/ (bildeanalysen) til Cloudflare Workers. Krever CF_WORKERS_TOKEN med
# «Workers Scripts: Edit» og «Workers AI»-tilgang, og CF_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["worker/**", "kb/**", "scripts/brevo_list.py", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions: { contents: read }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Find account for token
        id: acct
        env:
          T: ${{ secrets.CF_WORKERS_TOKEN }}
          A: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          ids=$(curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | python3 -c "import json,sys;d=json.load(sys.stdin);print(' '.join(a['id'] for a in d.get('result') or []))")
          echo "token sees $(echo $ids | wc -w) account(s)"
          for i in $ids; do echo "  ...${i: -6}"; done
          echo "CF_ACCOUNT_ID secret ends with ...${A: -6}"
          first=$(echo $ids | cut -d' ' -f1)
          echo "id=$first" >> "$GITHUB_OUTPUT"
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acct.outputs.id }}
        run: set -o pipefail; npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
      - name: Set Gemini key on worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acct.outputs.id }}
          G: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$G" ]; then printf '%s' "$G" | npx --yes wrangler@4 secret put GEMINI_API_KEY; else echo "GEMINI_API_KEY missing - Cloudflare only"; fi
      - name: Newsletter (Brevo) - list + secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acct.outputs.id }}
          B: ${{ secrets.BREVO_API_KEY }}
          S: ${{ secrets.NL_SENDER }}
        run: |
          if [ -z "$B" ] || [ -z "$S" ]; then echo "BREVO_API_KEY/NL_SENDER missing - newsletter signup stays off"; exit 0; fi
          id=$(python3 ../scripts/brevo_list.py)
          echo "Brevo list id: $id"
          printf '%s' "$B" | npx --yes wrangler@4 secret put BREVO_API_KEY
          printf '%s' "$S" | npx --yes wrangler@4 secret put NL_SENDER
          printf '%s' "$id" | npx --yes wrangler@4 secret put BREVO_LIST_ID
      - name: Smoke test (health + one real image)
        working-directory: worker
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker: $url"
          for i in 1 2 3 4 5 6; do curl -sf "$url/health" && break; sleep 10; done
          python3 - "$url" <<'PY'
          import base64, io, json, sys, urllib.request
          from PIL import Image
          for name in ["veps", "skjeggkre"]:
              im = Image.open(f"../site/assets/img/{name}.webp").convert("RGB"); im.thumbnail((1024, 1024))
              b = io.BytesIO(); im.save(b, "JPEG", quality=85)
              body = json.dumps({"image": "data:image/jpeg;base64," + base64.b64encode(b.getvalue()).decode()}).encode()
              req = urllib.request.Request(sys.argv[1] + "/identify", data=body, headers={"Content-Type": "application/json", "Origin": "https://codebystian.github.io", "User-Agent": "Mozilla/5.0 (smoke test)"})
              try:
                  r = json.load(urllib.request.urlopen(req, timeout=120))
                  print(name, "->", json.dumps({k: r.get(k) for k in ("level", "confidence", "name", "matched", "check", "visible", "model")}, ensure_ascii=False))
              except urllib.error.HTTPError as e:
                  print(name, "HTTP", e.code, e.read()[:300])
          PY
