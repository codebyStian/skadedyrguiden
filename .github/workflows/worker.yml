name: Deploy AI worker (Cloudflare)

# Publiserer worker/ (bildeanalysen) til Cloudflare Workers. Krever CF_WORKERS_TOKEN med
# «Workers Scripts: Edit» og «Workers AI»-tilgang, og CF_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["worker/**", "kb/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions: { contents: read }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Check token
        env:
          T: ${{ secrets.CF_WORKERS_TOKEN }}
          A: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "token length: ${#T}"
          curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c "import json,sys;d=json.load(sys.stdin);print('verify:',d.get('success'),d.get('result',{}).get('status'),d.get('errors'))"
          curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" | python3 -c "import json,sys;d=json.load(sys.stdin);print('subdomain:',d.get('success'),d.get('result'),d.get('errors'))"
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: set -o pipefail; npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
      - name: Smoke test
        working-directory: worker
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker: $url"
          curl -s "$url/health"
