name: Publish to GitHub Pages (kryp.as)

# Publiserer kryp.as. Sett repo-variabelen PREVIEW=1 for å skru av indeksering igjen.
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "kb/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pillow rjsmin
      - name: Build pages + SEO + performance
        env: { SITE_URL: "${{ vars.SITE_URL }}", PREVIEW: "${{ vars.PREVIEW || '0' }}" }
        run: python scripts/page.py && SITE_URL="${SITE_URL:-https://kryp.as}" python scripts/seo.py && python scripts/search.py && python scripts/perf.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      # Artefakten er ikke alltid synlig for deploy-pages med en gang («Found 0 artifact(s)»).
      # Vent litt, og prøv én gang til hvis første forsøk feiler.
      - run: sleep 20
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d1.outcome == 'failure'
        run: sleep 45
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
