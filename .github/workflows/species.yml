name: Leksikon - ekte foto og fagtekst

# Henter fritt lisensierte artsfoto fra Wikimedia Commons og utfyllende kjennetegn fra FHIs skadedyrhåndbok.
on:
  workflow_dispatch:
    inputs:
      force: { description: "Hent fagtekst på nytt for alle (1/0)", default: "0" }
      repick: { description: "Velg foto på nytt: all eller liste (mus,rotte)", default: "" }
  push:
    branches: [main]
    paths: ["kb/species.json", "scripts/species_photos.py", "scripts/species_info.py", "scripts/compare.py"]

permissions: { contents: write, actions: write }
concurrency: { group: species, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "pillow>=11.3"
      - name: Photos (Wikimedia Commons + iNaturalist, valgt av Gemini)
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}", REPICK: "${{ inputs.repick }}" }
        run: python scripts/species_photos.py
      - name: Smaller sizes (srcset)
        run: python scripts/img_variants.py
      - name: Fagtekst (FHI)
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}", FORCE: "${{ inputs.force == '1' && '1' || '' }}" }
        run: python scripts/species_info.py && python scripts/compare.py
      - name: Commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "skadedyrguiden-bot"; git config user.email "actions@users.noreply.github.com"
          git add site/assets/img/foto-*.webp; for d in s p m; do [ -d site/assets/img/$d ] && git add -A site/assets/img/$d; done
          for f in site/data/photos.json kb/species_info.json kb/compare.json data/img_variants.json; do [ -f $f ] && git add $f; done
          git diff --cached --quiet || git commit -qm "Leksikon: foto og fagtekst"
          git checkout -- . && git clean -fdq
          git pull --rebase -q && git push -q
          gh workflow run pages.yml
