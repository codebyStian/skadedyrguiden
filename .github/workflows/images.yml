name: Generate images (Cloudflare Workers AI)

# Lager manglende bilder fra scripts/images.json og committer dem.
# Krever repository secrets CF_ACCOUNT_ID og CF_API_TOKEN (Workers AI).
on:
  push:
    branches: [main]
    paths: ["scripts/images.json", "scripts/gen_images.py", ".github/workflows/images.yml"]
  workflow_dispatch:
    inputs:
      model: { description: "Modell (tomt = beste tilgjengelige)", required: false, default: "" }
      names: { description: "Bilder som skal lages på nytt (mellomromsseparert, tomt = bare manglende)", required: false, default: "" }

permissions: { contents: write }
concurrency: { group: images, cancel-in-progress: false }

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Generate
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MODEL: ${{ inputs.model }}
          FORCE: ${{ inputs.names != '' && '1' || '' }}
        run: python scripts/gen_images.py ${{ inputs.names }}
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain site/assets/img)" ]; then
            git config user.name "skadedyrguiden-bot"
            git config user.email "actions@users.noreply.github.com"
            git add site/assets/img && git commit -m "Add generated images [skip ci]" && git push
          fi
