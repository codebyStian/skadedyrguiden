name: Generate images (Cloudflare Workers AI)

# Lager manglende bilder fra scripts/images.json og committer dem.
# Krever repository secrets CF_ACCOUNT_ID og CF_API_TOKEN (Workers AI).
on:
  push:
    branches: [main]
    paths: ["scripts/images.json"]
  schedule: [{ cron: "30 0 * * *" }, { cron: "50 0 * * *" }]   # etter at gratiskvotene nullstilles (00:00 UTC); 00:50 bruker Workers-kontoen
  workflow_dispatch:
    inputs:
      account: { description: "Cloudflare-konto: images (standard) eller workers", required: false, default: "images" }
      model: { description: "Modell (tomt = beste tilgjengelige)", required: false, default: "" }
      provider: { description: "cloudflare (gratis) eller gemini (betalt, med stilreferanse)", required: false, default: "cloudflare" }
      names: { description: "Bilder som skal lages på nytt (mellomromsseparert, tomt = bare manglende)", required: false, default: "" }

permissions: { contents: write, actions: write }
concurrency: { group: images, cancel-in-progress: false }

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "pillow>=11.3"
      - name: Pick account
        id: acct
        env:
          WT: ${{ secrets.CF_WORKERS_TOKEN }}
        run: |
          if [ "${{ inputs.account }}" = "workers" ] || [ "${{ github.event.schedule }}" = "50 0 * * *" ]; then
            id=$(curl -s -H "Authorization: Bearer $WT" "https://api.cloudflare.com/client/v4/accounts" | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])")
            echo "::add-mask::$id"; echo "id=$id" >> "$GITHUB_OUTPUT"; echo "use=workers" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate
        env:
          CF_ACCOUNT_ID: ${{ steps.acct.outputs.id || secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ steps.acct.outputs.use == 'workers' && secrets.CF_WORKERS_TOKEN || secrets.CF_API_TOKEN }}
          MODEL: ${{ inputs.model }}
          PROVIDER: ${{ inputs.provider }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ inputs.names != '' && '1' || '' }}
        run: python scripts/gen_images.py ${{ inputs.names }}
      - name: Smaller sizes (srcset)
        run: python scripts/img_variants.py
      - name: Commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -n "$(git status --porcelain site/assets/img)" ]; then
            git config user.name "skadedyrguiden-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A site/assets/img data/img_variants.json && git commit -m "Add generated images [skip ci]" && git pull --rebase -q && git push
            gh workflow run pages.yml --ref main
          fi
